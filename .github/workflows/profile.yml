name: Refresh profile snake

# Rebuilds the monochrome contribution snake every day, inside this repo.

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Contribution snake (black and white)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: srinivas-rc0408
          outputs: |
            profile/snake-dark.svg?color_snake=#FFFFFF&color_dots=#161616,#3A3A3A,#6E6E6E,#A8A8A8,#E6E6E6
            profile/snake-light.svg?color_snake=#000000&color_dots=#EDEDED,#C4C4C4,#8C8C8C,#555555,#1A1A1A

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          if git diff --cached --quiet; then
            echo "Snake unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile snake"
          git push
