name: Refresh profile snake

# Rebuilds the contribution snake every day, inside this repo.

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Ice palette: glass-blue squares, white snake (dark); deep-ice snake (light).
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: srinivas-rc0408
          outputs: |
            profile/snake-dark.svg?color_snake=#F0F3F6&color_dots=#161B22,#123247,#1F5A7A,#3E95BF,#A5DCF5
            profile/snake-light.svg?color_snake=#0B3550&color_dots=#EBEEF1,#CFE6F3,#8CC6E4,#3C96C3,#165A7E

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/
          if git diff --cached --quiet; then
            echo "Snake unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile snake"
          git push
