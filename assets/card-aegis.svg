<svg xmlns="http://www.w3.org/2000/svg" width="470" height="262" viewBox="0 0 470 262" role="img" aria-labelledby="t d"><title id="t">AEGIS</title><desc id="d">AEGIS: air-gapped agentic AI workbench for Mangalore Refinery, Smart India Hackathon 2026. Runs a 7B model on a 4 GB laptop GPU. LangGraph, Ollama, FAISS, Docker.</desc><style>
text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#FFFFFF}
.g1{fill:#A3A3A3} .g2{fill:#5C5C5C} .b{font-weight:700}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-16}}
.pl{animation:pulse 1.6s ease-in-out infinite}
.mar{animation:march 1.2s linear infinite}
.orb{animation:spin 5s linear infinite}
.nd{animation:nd 5s linear infinite}
@keyframes nd{0%,6%{fill:#FFFFFF}12%,100%{fill:#000000}}
.pk{animation:pk 2.7s ease-in infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{transform:translateX(var(--dx));opacity:1}85%,100%{transform:translateX(var(--dx));opacity:0}}
