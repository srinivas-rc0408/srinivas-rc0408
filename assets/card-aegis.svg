FFFFFF" stroke-width="1.5" style="animation-delay:1s"/><circle class="nd" cx="391.5" cy="150.4" r="5.5" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" style="animation-delay:2s"/><circle class="nd" cx="344.5" cy="150.4" r="5.5" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" style="animation-delay:3s"/><circle class="nd" cx="330.0" cy="105.6" r="5.5" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" style="animation-delay:4s"/><g class="orb" style="transform-origin:368px 118px"><circle cx="368" cy="78" r="3" fill="#FFFFFF"/></g><text x="368" y="122" font-size="10" class="g2" text-anchor="middle">7B</text><circle class="pk" cx="478" cy="88" r="2.5" fill="#A3A3A3" style="--dx:-40px;animation-delay:0.0s"/><circle class="pk" cx="478" cy="140" r="2.5" fill="#A3A3A3" style="--dx:-40px;animation-delay:0.9s"/><circle class="pk" cx="258" cy="158" r="2.5" fill="#A3A3A3" style="--dx:40px;animation-delay:1.8s"/></svg>