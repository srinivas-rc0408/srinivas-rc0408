<svg xmlns="http://www.w3.org/2000/svg" width="470" height="262" viewBox="0 0 470 262" role="img" aria-labelledby="t d"><title id="t">AquaSentinel</title><desc id="d">AquaSentinel: mission control for an underwater inspection robot with telemetry, route planning and AI defect detection. Opens the live demo.</desc><style>
