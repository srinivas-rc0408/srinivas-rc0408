<svg xmlns="http://www.w3.org/2000/svg" width="470" height="262" viewBox="0 0 470 262" role="img" aria-labelledby="t d"><title id="t">health-risk-mlops</title><desc id="d">health-risk-mlops: a health-risk model served by FastAPI, containerised with Docker, tracked in MLflow, tested by GitHub Actions.</desc><style>
