<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" role="img" aria-labelledby="t d"><title id="t">Ajrasakha</title><desc id="d">Ajrasakha, AI engineer internship at IIT Ropar (remote): a multilingual assistant for farmers. Questions by text or voice in their own language. Answers come from an expert-verified golden dataset first, then package-of-practices guidelines, and a general LLM only as a fallback. React, TypeScript, Express, MongoDB Atlas vector search, Sarvam AI, Ollama.</desc><style>
text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#FFFFFF}
.g1{fill:#A3A3A3} .g2{fill:#5C5C5C} .b{font-weight:700}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-16}}

.pl{animation:pulse 1.6s ease-in-out infinite}
.q{animation:q 9s cubic-bezier(.5,0,.5,1) infinite}
@keyframes q{
0%{transform:translateY(0);opacity:0} 3%{transform:translateY(0);opacity:1}
10%,28%{transform:translateY(25px);opacity:1} 31%{transform:translateY(25px);opacity:0}
33.3%{transform:translateY(0);opacity:0} 36%{transform:translateY(0);opacity:1}
43%{transform:translateY(25px)} 50%,61%{transform:translateY(75px);opacity:1} 64%{transform:translateY(75px);opacity:0}
66.6%{transform:translateY(0);opacity:0} 69%{transform:translateY(0);opacity:1}
76%{transform:translateY(25px)} 83%{transform:translateY(75px)} 90%,97%{transform:translateY(125px);opacity:1} 100%{transform:translateY(125px);opacity:0}}
.t0{animation:t0 9s linear infinite} @keyframes t0{0%,10%{fill:#000000}11%,28%{fill:#FFFFFF}30%,42%{fill:#000000}43%,45%{fill:#262626}46%,75%{fill:#000000}76%,78%{fill:#262626}79%,100%{fill:#000000}}
.t1{animation:t1 9s linear infinite} @keyframes t1{0%,50%{fill:#000000}51%,61%{fill:#FFFFFF}63%,82%{fill:#000000}83%,85%{fill:#262626}86%,100%{fill:#000000}}
.t2{animation:t2 9s linear infinite} @keyframes t2{0%,90%{fill:#000000}91%,97%{fill:#FFFFFF}99%,100%{fill:#000000}}
.l0,.k0{animation:x0 9s linear infinite} @keyframes x0{0%,10%{fill:#FFFFFF}11%,28%{fill:#000000}30%,100%{fill:#FFFFFF}}
.l1,.k1{animation:x1 9s linear infinite} @keyframes x1{0%,50%{fill:#FFFFFF}51%,61%{fill:#000000}63%,100%{fill:#FFFFFF}}
.l2,.k2{animation:x2 9s linear infinite} @keyframes x2{0%,90%{fill:#FFFFFF}91%,97%{fill:#000000}99%,100%{fill:#FFFFFF}}
.k0,.k1,.k2{opacity:.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="262" fill="#000000"/><rect x=".5" y=".5" width="959" height="261" fill="none" stroke="#262626"/><path d="M8 18V8H18" fill="none" stroke="#A3A3A3" stroke-width="1.5"/><path d="M952 18V8H942" fill="none" stroke="#A3A3A3" stroke-width="1.5"/><path d="M8 244V254H18" fill="none" stroke="#A3A3A3" stroke-width="1.5"/><path d="M952 244V254H942" fill="none" stroke="#A3A3A3" stroke-width="1.5"/><circle class="pl" cx="30" cy="38" r="4" fill="#FFFFFF"/><text x="42" y="42" font-size="12" class="g1">interning / IIT Ropar, remote</text><text x="24" y="84" font-size="22" class="b">Ajrasakha</text><text x="24" y="114" font-size="12.5" class="g1">A multilingual assistant for farmers. They ask in their own</text><text x="24" y="134" font-size="12.5" class="g1">language, by text or voice, and get reliable answers fast.</text><text x="24" y="154" font-size="12.5" class="g1">Expert-verified answers come first. An LLM answers only when</text><text x="24" y="174" font-size="12.5" class="g1">no verified answer exists, because bad advice can cost a crop.</text><rect x="24.0" y="212" width="47.5" height="22" rx="11" fill="none" stroke="#5C5C5C"/><text x="47.8" y="227" font-size="10.5" class="g1" text-anchor="middle">React</text><rect x="77.5" y="212" width="79.0" height="22" rx="11" fill="none" stroke="#5C5C5C"/><text x="117.0" y="227" font-size="10.5" class="g1" text-anchor="middle">TypeScript</text><rect x="162.5" y="212" width="60.1" height="22" rx="11" fill="none" stroke="#5C5C5C"/><text x="192.6" y="227" font-size="10.5" class="g1" text-anchor="middle">Express</text><rect x="228.6" y="212" width="97.9" height="22" rx="11" fill="none" stroke="#5C5C5C"/><text x="277.6" y="227" font-size="10.5" class="g1" text-anchor="middle">MongoDB Atlas</text><rect x="332.5" y="212" width="97.9" height="22" rx="11" fill="none" stroke="#5C5C5C"/><text x="381.4" y="227" font-size="10.5" class="g1" text-anchor="middle">Vector search</text><rect x="436.4" y="212" width="72.7" height="22" rx="11" fill="none" stroke="#5C5C5C"/><text x="472.8" y="227" font-size="10.5" class="g1" text-anchor="middle">Sarvam AI</text><rect x="515.1" y="212" width="53.8" height="22" rx="11" fill="none" stroke="#5C5C5C"/><text x="542.0" y="227" font-size="10.5" class="g1" text-anchor="middle">Ollama</text><line x1="805.0" y1="30" x2="805.0" y2="166" stroke="#262626" stroke-dasharray="2 4"/><rect class="t0" x="680" y="66" width="250" height="28" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.2"/><text class="l0" x="694" y="84.5" font-size="12">golden dataset</text><text class="k0" x="916" y="84.5" font-size="12" text-anchor="end">verified</text><rect class="t1" x="680" y="116" width="250" height="28" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.2"/><text class="l1" x="694" y="134.5" font-size="12">package of practices</text><text class="k1" x="916" y="134.5" font-size="12" text-anchor="end">verified</text><rect class="t2" x="680" y="166" width="250" height="28" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="4 3"/><text class="l2" x="694" y="184.5" font-size="12">general LLM</text><text class="k2" x="916" y="184.5" font-size="12" text-anchor="end">fallback</text><circle class="q" cx="805.0" cy="34" r="5" fill="#FFFFFF"/><text x="805.0" y="220" font-size="11" class="g2" text-anchor="middle">verified knowledge first, LLM last</text></svg>