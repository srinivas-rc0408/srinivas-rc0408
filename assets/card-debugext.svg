<svg xmlns="http://www.w3.org/2000/svg" width="470" height="262" viewBox="0 0 470 262" role="img" aria-labelledby="t d"><title id="t">Debug.ext</title><desc id="d">Debug.ext: Chrome extension that catches runtime errors, ranks them P0 to P3, and drafts the fix. FastAPI and Streamlit.</desc><style>
text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#FFFFFF}
.g1{fill:#A3A3A3} .g2{fill:#5C5C5C} .b{font-weight:700}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-16}}
.rg{animation:ring 2.2s cubic-bezier(.2,.6,.3,1) infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.er{animation:er 4s linear infinite}
@keyframes er{0%,15%{fill:#5C5C5C}18%,55%{fill:#FFFFFF}62%,100%{fill:#5C5C5C}}
.pz{animation:pz 4s linear infinite}
@keyframes pz{0%,18%{opacity:0}20%,55%{opacity:1}58%,100%{opacity:0}}
.fx{animation:fx 4s linear infinite}
@keyframes fx{0%,60%{opacity:0}63%,92%{opacity:1}97%,100%{opacity:0}}
.cu{animation:blink 1.06s step-end infinite}
