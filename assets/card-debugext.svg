="394" y="107" width="30" height="16" rx="3" fill="#FFFFFF"/><text x="409" y="119" font-size="10.5" text-anchor="middle" style="fill:#000000" class="b">P0</text></g><g class="fx"><path d="M398 115l4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><text x="414" y="119" font-size="10.5" class="g1">fixed</text></g><rect class="cu" x="298" y="180" width="8" height="12" fill="#FFFFFF"/></svg>