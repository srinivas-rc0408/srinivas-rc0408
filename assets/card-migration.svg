<svg xmlns="http://www.w3.org/2000/svg" width="470" height="262" viewBox="0 0 470 262" role="img" aria-labelledby="t d"><title id="t">Migration Agent</title><desc id="d">Codebase migration agent: an LLM agent that upgrades whole codebases across breaking version changes and tests its own edits. Python, AST, Docker.</desc><style>
text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#FFFFFF}
.g1{fill:#A3A3A3} .g2{fill:#5C5C5C} .b{font-weight:700}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-16}}
.rg{animation:ring 2.2s cubic-bezier(.2,.6,.3,1) infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}@keyframes m0{0%,10%{fill:#262626}14%,88%{fill:#FFFFFF}96%,100%{fill:#262626}}.m0{animation:m0 6.0s linear infinite}@keyframes m1{0%,20%{fill:#262626}24%,88%{fill:#FFFFFF}96%,100%{fill:#262626}}.m1{animation:m1 6.0s linear infinite}@keyframes m2{0%,30%{fill:#262626}34%,88%{fill:#FFFFFF}96%,100%{fill:#262626}}.m2{animation:m2 6.0s linear infinite}@keyframes m3{0%,40%{fill:#262626}44%,88%{fill:#FFFFFF}96%,100%{fill:#262626}}.m3{animation:m3 6.0s linear infinite}@keyframes m4{0%,50%{fill:#262626}54%,88%{fill:#FFFFFF}96%,100%{fill:#262626}}.m4{animation:m4 6.0s linear infinite}@keyframes m5{0%,60%{fill:#262626}64%,88%{fill:#FFFFFF}96%,100%{fill:#262626}}.m5{animation:m5 6.0s linear infinite}
.scn{animation:scn 6.0s linear infinite}
@keyframes scn{0%,8%{transform:translateY(0);opacity:0}10%{opacity:1}70%{transform:translateY(96px);opacity:1}72%,100%{transform:translateY(96px);opacity:0}}
.ok{animation:ok 6.0s linear infinite}
@keyframes ok{0%,74%{opacity:0}76%,90%{opacity:1}96%,100%{opacity:0}}
