<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" role="img" aria-labelledby="t d"><title id="t">Ajrasakha</title><desc id="d">Ajrasakha, AI engineer internship at IIT Ropar (remote): a multilingual assistant for farmers. Questions by text or voice in their own language. Expert-verified golden dataset first, then package-of-practices guidelines, then a general LLM only as a fallback. React, TypeScript, Express, MongoDB Atlas vector search, Sarvam AI, Ollama.</desc><style>
