<svg xmlns="http://www.w3.org/2000/svg" width="470" height="262" viewBox="0 0 470 262" role="img" aria-labelledby="t d"><title id="t">AEGIS</title><desc id="d">AEGIS: air-gapped agentic AI workbench for Mangalore Refinery, Smart India Hackathon 2026. Runs a 7B model on a 4 GB laptop GPU. LangGraph, Ollama, FAISS, Docker.</desc><style>
text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#F0F3F6}
.f2{fill:#9198A1} .f3{fill:#656C76} .b{font-weight:700}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-16}}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.rg{animation:ring 2.2s cubic-bezier(.2,.6,.3,1) infinite}
.mar{animation:march 1.2s linear infinite}.orb{animation:spin 5s linear infinite}
.nd{animation:nd 5s linear infinite}@keyframes nd{0%,6%{fill:#F0F3F6}12%,100%{fill:#12161D}}
.pk{animation:pk 2.7s ease-in infinite}
