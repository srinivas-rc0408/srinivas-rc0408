<svg xmlns="http://www.w3.org/2000/svg" width="470" height="262" viewBox="0 0 470 262" role="img" aria-labelledby="t d"><title id="t">ArchAgent</title><desc id="d">ArchAgent: a plain-language building brief becomes 3D renders and an itemised INR cost estimate in under 60 seconds. React, TypeScript, Gemini.</desc><style>
